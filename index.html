<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DeepSeek 随身版</title>
  <meta name="description" content="个人使用的 DeepSeek API 手机对话客户端，支持图片、文件和深度思考">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeepSeek">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" type="button" aria-label="打开对话列表">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="title-wrap">
        <h1 id="chat-title">新对话</h1>
        <span id="model-chip" class="chip">deepseek-flash</span>
      </div>
      <button id="btn-new" class="icon-btn" type="button" aria-label="新建对话">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main id="messages" class="messages">
      <div id="empty" class="empty">
        <img class="empty-logo" src="./icons/icon-192.png" alt="" width="76" height="76">
        <h2>有什么可以帮你的？</h2>
        <p class="muted">对话只保存在这台手机上</p>
        <div class="suggestions">
          <button class="suggest" type="button" data-prompt="用简单的语言解释一下什么是 API，举一个生活化的例子。">解释一个概念</button>
          <button class="suggest" type="button" data-prompt="帮我写一封请假邮件，理由是明天上午需要去医院复查，语气礼貌简洁。">帮我写一封邮件</button>
          <button class="suggest" type="button" data-prompt="我有一份很长的工作汇报，帮我提炼成 5 条要点，每条不超过 30 字。">总结提炼</button>
          <button class="suggest" type="button" data-prompt="给我一份 3 天的城市周边游行程，节奏轻松，包含吃饭建议。">做个出行计划</button>
        </div>
      </div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <div id="pending" class="pending" hidden></div>
      <div class="composer-inner">
        <button id="btn-attach" class="attach-btn" type="button" aria-label="添加图片或文件">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="发消息或上传图片、文件…" enterkeyhint="send" aria-label="输入消息"></textarea>
        <button id="btn-send" class="send-btn" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-stop" class="send-btn stop" type="button" aria-label="停止生成" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="composer-meta">
        <button id="btn-thinking" class="think-pill" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z" fill="currentColor"/></svg>
          <span>深度思考</span>
        </button>
        <span class="hint">内容由 AI 生成，请注意甄别</span>
      </div>
    </form>
  </div>

  <div id="scrim" class="scrim" hidden></div>

  <aside id="drawer" class="drawer" aria-label="对话列表" aria-hidden="true">
    <div class="drawer-head">
      <span>对话</span>
      <button id="btn-new-2" class="icon-btn" type="button" aria-label="新建对话">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="conv-list" class="conv-list"></div>
    <div class="drawer-foot">
      <button id="btn-install" class="foot-btn" type="button" hidden>添加到主屏幕</button>
      <button id="btn-settings" class="foot-btn" type="button">设置</button>
      <button id="btn-export" class="foot-btn" type="button">导出备份</button>
      <button id="btn-import" class="foot-btn" type="button">导入备份</button>
      <input id="file-import" type="file" accept="application/json,.json" hidden>
    </div>
  </aside>

  <div id="settings" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">设置</h2>
        <button id="btn-close-settings" class="icon-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>API Key</span>
          <input id="set-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
          <small>只存在本机浏览器里，请求时直接发给 DeepSeek，不经过任何第三方服务器。</small>
        </label>
        <label class="field">
          <span>接口地址</span>
          <input id="set-base" type="url" placeholder="https://api.deepseek.com" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span>模型</span>
          <input id="set-model" list="model-list" placeholder="deepseek-flash" autocomplete="off" spellcheck="false">
          <datalist id="model-list">
            <option value="deepseek-flash"></option>
            <option value="deepseek-v4-pro"></option>
          </datalist>
          <small>图片和文件需要 deepseek-flash；开启深度思考时温度不生效。</small>
        </label>
        <label class="field">
          <span>系统提示词</span>
          <textarea id="set-system" rows="3" placeholder="你是一个乐于助人的 AI 助手，请用简体中文回答。"></textarea>
        </label>
        <div class="field-row">
          <label class="field">
            <span>上下文条数</span>
            <input id="set-context" type="number" min="2" max="100" step="1" inputmode="numeric">
          </label>
          <label class="field">
            <span>温度</span>
            <input id="set-temp" type="number" min="0" max="2" step="0.1" inputmode="decimal">
          </label>
        </div>
        <p id="settings-msg" class="form-msg" hidden></p>
      </div>
      <div class="modal-foot">
        <button id="btn-clear-key" class="btn ghost" type="button">清除密钥</button>
        <button id="btn-save-settings" class="btn primary" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="attach-sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="添加图片或文件">
      <button class="sheet-item" type="button" data-pick="camera"><span class="sheet-ico">📷</span>拍照</button>
      <button class="sheet-item" type="button" data-pick="gallery"><span class="sheet-ico">🖼️</span>从相册选择</button>
      <button class="sheet-item" type="button" data-pick="file"><span class="sheet-ico">📄</span>选择文件（PDF / Word / Excel / 文本）</button>
      <button class="sheet-item cancel" type="button" data-pick="cancel">取消</button>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" alt="图片预览">
  </div>

  <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="file-gallery" type="file" accept="image/*" multiple hidden>
  <input id="file-doc" type="file" multiple hidden
    accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.csv,.json,.epub,.mobi,application/pdf,text/plain,text/markdown,text/csv,application/json">

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:24px">需要开启 JavaScript 才能使用。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
